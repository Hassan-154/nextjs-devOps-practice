name: Docker Image CI
on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: [self-hosted, linux, x64] 
    steps:
    - uses: actions/checkout@v4
    - name: Set up environment variable for tag
      run: echo "IMAGE_TAG=$(date +%s)" >> $GITHUB_ENV
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/hassan-154/nextjs-devops-practice/my-image-name:${{ env.IMAGE_TAG }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }} # Use the new PAT
    - name: Push Docker image
      run: docker push ghcr.io/hassan-154/nextjs-devops-practice/my-image-name:${{ env.IMAGE_TAG }}
